<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
    <body>
      <div class="container">
            <div class="image-div">
                <img src="./images/background.jpg" alt="background">
                <div class="odin-logo">
                    <img src="./images/odin-logo.png" alt="odin-logo">
                    <h4>ODIN</h4>
                </div>
            </div>

            <div class="login-form-div">
                <div class="upper-div">
                    <p>This is not a real online service! You know you need something<br>
                    like this in your life to help you realize your deepest dreams.<br>
                    Sign up now to get started.</p>
                    <p class="downer-p">You know you want to.</p>

                </div>

                <div class="middle-div">
                    
                    <form action="#">
                        <!-- <div>Let's do this!</div> -->

                        <div class="left-form-group">
                            <h2>Let's do this!</h2>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" class="blue-elements">

                            <label for="email">EMAIL</label>
                            <input type="email" id="email" class="blue-elements" placeholder="you@gmail.com">

                            <label for="password">PASSWORD</label>
                            <input type="password" class="red-elements" id="password">
                        </div>

                        <div class="right-form-group">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" class="blue-elements">

                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="text" id="phone-number" placeholder="07XXXXXXXX">

                            <label for="password">COMFIRM PASSWORD</label>
                            <input type="password" class = "red-elements">
                        </div>
                        
                    </form>

                </div>

                <div class="downer-div">
                    <button>Create Account</button>
                    <h4>Aready have an account? <a>Log in</a></h4>
                </div>

            </div>

        </div>

    </body>

</html>
